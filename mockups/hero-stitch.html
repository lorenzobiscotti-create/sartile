<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>helmerge — stitch hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --frost: #F6F8FC;
    --slate: #1C2B4A;
    --teal: #00C4B4;
    --white: #FFFFFF;
    --frost-blue: #C8D8EC;
    --muted-slate: #7A8BA8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--teal);
    color: var(--white);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 22px 24px 60px;
    overflow: hidden;
    /* deep teal base with a soft radial lift so it isn't flat */
    background:
      radial-gradient(ellipse at 50% 38%, #14d3c2 0%, #00C4B4 42%, #00b3a4 100%);
  }

  /* ---------- the stitch animation layer ---------- */
  .stitch-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  .stitch-bg svg { width: 100%; height: 100%; display: block; }

  /* the white thread draws itself in, then stays */
  .thread-path {
    fill: none;
    stroke: #ffffff;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: draw 16s cubic-bezier(.45,0,.2,1) forwards;
  }
  /* faint shadow copy under the thread for depth */
  .thread-shadow {
    fill: none;
    stroke: rgba(0,80,72,0.28);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    transform: translateY(5px);
    filter: blur(3px);
    animation: draw 16s cubic-bezier(.45,0,.2,1) forwards;
  }

  /* once laid down, the whole thread breathes ever so slightly */
  .thread-group {
    animation: float 9s ease-in-out infinite;
    transform-origin: center;
  }

  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-4px); }
  }

  /* ---------- floating pill nav ---------- */
  .nav {
    position: relative;
    z-index: 5;
    width: 100%;
    max-width: 1180px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 12px 14px 12px 26px;
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.30);
    border-radius: 999px;
    box-shadow: 0 14px 40px -20px rgba(0,60,54,0.5);
  }
  .wordmark {
    font-weight: 700;
    font-size: 30px;
    letter-spacing: -0.025em;
    color: var(--white);
    flex-shrink: 0;
    cursor: default;
    transition: opacity 0.2s ease;
  }
  .wordmark .m { color: var(--slate); }
  .wordmark:hover { opacity: 0.75; }

  .nav-links {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 30px;
  }
  .nav-links a {
    font-weight: 600;
    font-size: 15px;
    color: rgba(255,255,255,0.82);
    text-decoration: none;
    transition: color 0.18s ease;
  }
  .nav-links a:hover { color: var(--white); }

  .nav-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .nav-login {
    font-weight: 600;
    font-size: 15px;
    color: var(--white);
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 999px;
    transition: background 0.18s ease;
  }
  .nav-login:hover { background: rgba(255,255,255,0.14); }
  .nav-cta {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--teal);
    background: var(--white);
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: transform 0.15s ease, box-shadow 0.18s ease;
    box-shadow: 0 10px 24px -12px rgba(0,60,54,0.6);
  }
  .nav-cta:hover { transform: translateY(-1px); box-shadow: 0 14px 30px -12px rgba(0,60,54,0.7); }
  .nav-cta .arrow { transition: transform 0.2s ease; }
  .nav-cta:hover .arrow { transform: translateX(3px); }

  /* ---------- hero center ---------- */
  .stage {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 880px;
    margin: 0 auto;
    text-align: center;
  }
  .eyebrow {
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
    margin-bottom: 24px;
    opacity: 0; animation: fadeUp 0.7s ease forwards;
  }
  .headline {
    font-weight: 800;
    font-size: clamp(40px, 6vw, 76px);
    line-height: 1.04;
    letter-spacing: -0.03em;
    color: var(--white);
    max-width: 18ch;
    opacity: 0; animation: fadeUp 0.7s ease forwards; animation-delay: 0.08s;
  }
  .subhead {
    font-weight: 400;
    font-size: clamp(16px, 1.7vw, 20px);
    line-height: 1.55;
    color: rgba(255,255,255,0.88);
    max-width: 50ch;
    margin-top: 24px;
    opacity: 0; animation: fadeUp 0.7s ease forwards; animation-delay: 0.16s;
  }
  .cta-row {
    display: flex; gap: 14px; margin-top: 38px;
    opacity: 0; animation: fadeUp 0.7s ease forwards; animation-delay: 0.24s;
  }
  .btn-primary {
    font-family: 'Outfit', sans-serif;
    font-weight: 700; font-size: 17px;
    color: var(--teal); background: var(--white);
    border: none; border-radius: 14px;
    padding: 16px 32px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 18px 40px -16px rgba(0,60,54,0.6);
    transition: transform 0.15s ease, box-shadow 0.18s ease;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 24px 50px -16px rgba(0,60,54,0.7); }
  .btn-primary .arrow { transition: transform 0.2s ease; }
  .btn-primary:hover .arrow { transform: translateX(3px); }
  .btn-ghost {
    font-family: 'Outfit', sans-serif;
    font-weight: 700; font-size: 17px;
    color: var(--white); background: transparent;
    border: 1px solid rgba(255,255,255,0.4); border-radius: 14px;
    padding: 16px 30px; cursor: pointer;
    transition: background 0.18s ease;
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.12); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 820px) { .nav-links { display: none; } }
  @media (max-width: 560px) {
    .nav-login { display: none; }
    .wordmark { font-size: 22px; }
    .cta-row { flex-direction: column; width: 100%; }
    .btn-primary, .btn-ghost { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
  <section class="hero">

    <!-- stitch animation background -->
    <div class="stitch-bg" aria-hidden="true">
      <svg viewBox="0 0 1440 820" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
        <defs>
          <!-- brushed silver gradient for the needle -->
          <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#fdfdff"/>
            <stop offset="22%" stop-color="#d6dbe3"/>
            <stop offset="50%" stop-color="#9aa2b0"/>
            <stop offset="78%" stop-color="#d6dbe3"/>
            <stop offset="100%" stop-color="#f4f6fa"/>
          </linearGradient>
          <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#004b44" flood-opacity="0.35"/>
          </filter>

          <!-- the stitch route (used only as the motion path) -->
          <path id="route" pathLength="1000" d="M 90,170 C 320,70 560,130 740,95 C 980,48 1200,150 1352,120 C 1430,300 1300,380 1366,540 C 1408,690 1140,720 980,706 C 700,732 480,656 300,710 C 130,758 52,600 96,420 C 120,300 56,250 90,170 Z"/>
        </defs>

        <!-- thread (shadow + white line), draws in then floats -->
        <g class="thread-group">
          <path class="thread-shadow" pathLength="1000" d="M 90,170 C 320,70 560,130 740,95 C 980,48 1200,150 1352,120 C 1430,300 1300,380 1366,540 C 1408,690 1140,720 980,706 C 700,732 480,656 300,710 C 130,758 52,600 96,420 C 120,300 56,250 90,170 Z"/>
          <path class="thread-path" pathLength="1000" d="M 90,170 C 320,70 560,130 740,95 C 980,48 1200,150 1352,120 C 1430,300 1300,380 1366,540 C 1408,690 1140,720 980,706 C 700,732 480,656 300,710 C 130,758 52,600 96,420 C 120,300 56,250 90,170 Z"/>
        </g>

        <!-- the travelling needle; animations nested inside their targets -->
        <g filter="url(#softShadow)">
          <g id="needleMotion">
            <g id="needleBob">
              <!-- needle points along +x (tip to the right) -->
              <path d="M 46,0 L -34,-3.6 L -42,0 L -34,3.6 Z" fill="url(#silver)" stroke="#8b93a1" stroke-width="0.5"/>
              <!-- specular highlight -->
              <path d="M 40,-1.1 L -30,-2.2" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="0.85"/>
              <!-- the eye -->
              <ellipse cx="-26" cy="0" rx="3.4" ry="1.7" fill="#00b3a4"/>
              <!-- subtle dip-below-surface bob -->
              <animateTransform attributeName="transform" type="scale"
                values="1 1; 0.86 0.86; 1 1; 0.9 0.9; 1 1; 0.84 0.84; 1 1"
                dur="16s" repeatCount="indefinite" additive="sum"/>
            </g>
            <!-- needle follows the route; closed path = seamless loop -->
            <animateMotion dur="16s" repeatCount="indefinite" rotate="auto" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.2 1">
              <mpath xlink:href="#route"/>
            </animateMotion>
          </g>
        </g>
      </svg>
    </div>

    <nav class="nav">
      <div class="wordmark">hel<span class="m">m</span>erge</div>
      <div class="nav-links">
        <a href="#">How it works</a>
        <a href="#">Tools</a>
        <a href="#">Pricing</a>
      </div>
      <div class="nav-right">
        <a href="#" class="nav-login">Log in</a>
        <button class="nav-cta">Start free <span class="arrow">→</span></button>
      </div>
    </nav>

    <div class="stage">
      <div class="eyebrow">Where brands are born</div>
      <h1 class="headline">Your co-partner from zero to first sale</h1>
      <p class="subhead">helmerge walks with you the whole way — from a vibe in your head to a brand people buy. Not a course. A partner.</p>
      <div class="cta-row">
        <button class="btn-primary">Start free <span class="arrow">→</span></button>
        <button class="btn-ghost">See how it works</button>
      </div>
    </div>
  </section>
</body>
</html>
